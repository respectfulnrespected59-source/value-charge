# VALUE CHARGE on Render: a static site (free plan), no build step.
# The station data is committed (public/data), rebuilt with `npm run data:fetch && npm run data:build`.
# Header values must match scripts/headers.mjs - `npm run test:unit` checks that they do.
services:
  - type: web
    name: value-charge
    runtime: static
    branch: main
    autoDeploy: true # every push to main goes live: run `npm test` first
    buildCommand: echo "static site, nothing to build"
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://tiles.openfreemap.org https://nominatim.openstreetmap.org https://photon.komoot.io; worker-src 'self'; child-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(self), payment=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
      - path: /vendor/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /fonts/*
        name: Cache-Control
        value: "public, max-age=86400"
      - path: /img/*
        name: Cache-Control
        value: "public, max-age=86400"
      - path: /data/*
        name: Cache-Control
        value: "public, max-age=3600"
      - path: /
        name: Cache-Control
        value: "no-cache"
      - path: /index.html
        name: Cache-Control
        value: "no-cache"
      - path: /sw.js
        name: Cache-Control
        value: "no-cache"
      - path: /manifest.webmanifest
        name: Cache-Control
        value: "no-cache"
      - path: /css/*
        name: Cache-Control
        value: "no-cache"
      - path: /js/*
        name: Cache-Control
        value: "no-cache"
